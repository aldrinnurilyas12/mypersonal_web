version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-app-personal_website
    ports:
      - "8080:82"
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    command: [ "apache2-foreground" ]
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: personal_web_db
      DB_USERNAME: aldrin
      DB_PASSWORD: aldrin123
    depends_on:
      - db

  db:
    image: mysql:latest
    container_name: mysqldb
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: personal_web_db
      MYSQL_USER: aldrin
      MYSQL_PASSWORD: aldrin123
      MYSQL_LOG_BIN_TRUST_FUNCTION_CREATORS: 1
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
  # phpmyadmin:
  #   image: phpmyadmin/phpmyadmin
  #   container_name: phpmyadmin
  #   environment:
  #     PMA_HOST: db
  #     PMA_PORT: 3306
  #   ports:
  #     - "8080:80"
  #   depends_on:
  #     - db

volumes:
  mysql_data:
